<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Food</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  .restaurant-list { list-style: none; padding: 0; }
  .restaurant-list li { padding: 0.5rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 0.5rem; cursor: pointer; }
  .restaurant-list li.selected { border-color: #333; background: #f5f5f5; }
  .menu-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  #result { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; }
  #result.success { background: #e8f7ec; border: 1px solid #2e7d32; }
  #result.failure { background: #fdecea; border: 1px solid #c62828; color: #c62828; }
  #result dl { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; margin: 0; }
</style>
</head>
<body>
<h1>Order Food</h1>

<h2>Restaurants</h2>
<ul class="restaurant-list" id="restaurants"></ul>

<div id="menuSection" style="display:none;">
  <h2 id="menuHeading">Menu</h2>
  <div id="menu"></div>
  <button id="placeOrder">Place order</button>
</div>

<div id="result" style="display:none;"></div>

<script>
let selectedRestaurantId = null;
let menuItems = [];

async function loadRestaurants() {
  const response = await fetch('/api/restaurants');
  const restaurants = await response.json();
  const list = document.getElementById('restaurants');
  list.innerHTML = '';
  restaurants.forEach(r => {
    const li = document.createElement('li');
    li.textContent = `${r.name} (${r.cuisine})`;
    li.addEventListener('click', () => selectRestaurant(r.id, r.name));
    list.appendChild(li);
  });
}

async function selectRestaurant(id, name) {
  selectedRestaurantId = id;
  document.querySelectorAll('.restaurant-list li').forEach(li => li.classList.remove('selected'));
  [...document.querySelectorAll('.restaurant-list li')]
    .find(li => li.textContent.startsWith(name))
    .classList.add('selected');

  const response = await fetch(`/api/restaurants/${id}/menu`);
  menuItems = await response.json();

  const menu = document.getElementById('menu');
  menu.innerHTML = '';
  menuItems.forEach(item => {
    const row = document.createElement('div');
    row.className = 'menu-item';
    row.innerHTML = `
      <input type="checkbox" id="item-${item.id}" value="${item.id}">
      <label for="item-${item.id}">${item.name} - $${(item.priceCents / 100).toFixed(2)}</label>
    `;
    menu.appendChild(row);
  });

  document.getElementById('menuHeading').textContent = `Menu: ${name}`;
  document.getElementById('menuSection').style.display = 'block';
  document.getElementById('result').style.display = 'none';
}

async function placeOrder() {
  const itemIds = [...document.querySelectorAll('#menu input[type=checkbox]:checked')]
    .map(cb => Number(cb.value));

  if (itemIds.length === 0) {
    alert('Select at least one item.');
    return;
  }

  const button = document.getElementById('placeOrder');
  button.disabled = true;

  const started = performance.now();
  try {
    const response = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ restaurantId: selectedRestaurantId, itemIds })
    });
    const elapsedMs = Math.round(performance.now() - started);
    const body = await response.json();
    showResult(response.ok, body, elapsedMs);
  } catch (err) {
    const elapsedMs = Math.round(performance.now() - started);
    showResult(false, { message: String(err) }, elapsedMs);
  } finally {
    button.disabled = false;
  }
}

function showResult(ok, body, elapsedMs) {
  const result = document.getElementById('result');
  result.style.display = 'block';
  result.className = ok ? 'success' : 'failure';

  if (ok) {
    result.innerHTML = `
      <dl>
        <dt>Status</dt><dd>${body.status}</dd>
        <dt>Total</dt><dd>$${(body.totalCents / 100).toFixed(2)}</dd>
        <dt>Driver</dt><dd>${body.driver ?? '-'}</dd>
        <dt>ETA</dt><dd>${body.etaMinutes ?? '-'} min</dd>
        <dt>Took</dt><dd>${elapsedMs} ms</dd>
      </dl>`;
  } else {
    result.innerHTML = `
      <dl>
        <dt>Status</dt><dd>${body.status ?? 'ERROR'}</dd>
        <dt>Message</dt><dd>${body.message ?? 'Unknown error'}</dd>
        <dt>Took</dt><dd>${elapsedMs} ms</dd>
      </dl>`;
  }
}

document.getElementById('placeOrder').addEventListener('click', placeOrder);
loadRestaurants();
</script>
</body>
</html>
