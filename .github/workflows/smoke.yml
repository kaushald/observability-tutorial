name: Lessons

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: advanced/services/go.mod
          cache-dependency-path: advanced/services/go.sum
      - uses: gradle/actions/setup-gradle@v4

      - name: Go tests
        working-directory: advanced/services
        run: go vet ./... && go test ./...

      - name: Java tests
        working-directory: advanced
        run: ./gradlew test

      - name: Build all lessons
        run: advanced/scripts/build.sh

      - name: Lessons differ only where they should
        run: advanced/scripts/lesson-diff.sh --check

      - name: Smoke test every lesson
        run: |
          for lesson in advanced/[0-9][0-9][0-9]-*/; do
            advanced/scripts/smoke.sh "$(basename "$lesson")"
          done
